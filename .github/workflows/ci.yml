name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install (workspaces)
        run: npm ci

      - name: Build web
        run: npm run build:web

      - name: API smoke (syntax)
        run: npm run test:api
